name: Daily Geopolitical Briefing

on:
  workflow_dispatch:
    # Triggered daily by cron-job.org at UTC 06:00 (Amsterdam 08:00 CEST)
    # cron-job.org is the sole scheduler — no GitHub schedule to avoid duplicate sends
    inputs:
      dry_run:
        description: 'DRY_RUN (true = skip Buttondown)'
        required: false
        default: ''
      send_mode:
        description: 'SEND_MODE (draft | send)'
        required: false
        default: ''
      podcast_enabled:
        description: 'PODCAST_ENABLED (true = generate podcast)'
        required: false
        default: ''
      podcast_dry_run:
        description: 'PODCAST_DRY_RUN (true = skip GitHub Release upload)'
        required: false
        default: ''

concurrency:
  group: daily-briefing
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_MODEL: ${{ vars.AI_MODEL || 'claude' }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-20250514' }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
          GLM_MODEL: ${{ vars.GLM_MODEL || 'glm-4.7-flash' }}
          PODCAST_TTS_MODEL: ${{ vars.PODCAST_TTS_MODEL || 'gpt-4o-mini-tts' }}
          PODCAST_SITE_URL: ${{ vars.PODCAST_SITE_URL || 'https://geopolitical-newsletter.vercel.app' }}
          GITHUB_REPO: ${{ vars.GITHUB_REPO || 'simywang/geopolitical-newsletter' }}
          SEND_MODE: ${{ github.event.inputs.send_mode || vars.SEND_MODE || 'draft' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          PODCAST_ENABLED: ${{ github.event.inputs.podcast_enabled || vars.PODCAST_ENABLED || 'false' }}
          PODCAST_DRY_RUN: ${{ github.event.inputs.podcast_dry_run || vars.PODCAST_DRY_RUN || 'true' }}
        run: python src/main.py

      - name: Commit updated podcast.xml
        if: ${{ vars.PODCAST_ENABLED == 'true' || github.event.inputs.podcast_enabled == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add podcast.xml
          git diff --staged --quiet || git commit -m "chore: podcast episode $(date -u +%Y-%m-%d)"
          git push
